zed:
  # Options: METER, CENTIMETER, MILLIMETER, INCH, FOOT
  coordinate_units: METER
  # pipeline assumes Z is up, X is forward, Y is left
  coordinate_system: RIGHT_HANDED_Z_UP_X_FWD
  # Options: PERFORMANCE, QUALITY, ULTRA, NEURAL
  depth_mode: PERFORMANCE
  # most optimal resolution for SLAM is HD720
  resolution: HD720
  # path to the svo file to replay. If empty, the real ZED camera is used.
  svo_path: "/home/leen/Documents/ZED/TRANSLATE12M.svo2"

  # When svo_real_time_mode = true, the ZED SDK throttles SVO playback to match the original recording FPS. 
  svo_real_time: true 
  fps: 30
  # frames to skip between each processed frame. 0 = process every frame, 1 = process every other frame, etc.
  frame_skip: 0
  # SLAM / positional tracking
  # Options: GEN_1 (lower CPU), GEN_3 (better accuracy, recommended)
  tracking_mode: GEN_3
  # Loop closure: corrects drift when the robot revisits known areas.
  # Disable if memory is constrained or the robot never revisits locations.
  enable_area_memory: true
  # Fuse IMU with visual odometry. Disable only for IMU-less SVO replay.
  enable_imu_fusion: true
  # Temporal low-pass filter on pose output. Adds latency; keep false for control loops.
  enable_pose_smoothing: false


voxel_filter:
  voxel_size_x: 0.05          # Voxel width along X, in metres
  voxel_size_y: 0.05          # Voxel width along Y, in metres
  voxel_size_z: 0.05          # Voxel height along Z, in metres
  min_points_per_voxel: 3     # Minimum occupancy to keep a voxel; voxels with fewer points are dropped as noise

polarize:
  z_threshold: 0.45           # Max absolute Z height to keep, in metres (points with |z| >= this are discarded).
  min_range: 0.1               # Min horizontal range to keep, in metres (points with r <= this are discarded, removes robot-body / sensor blind-spot returns)

traversability:
  r_min_m: 0.3                 # Inner radial edge of the polar grid, in metres (hardcoded extent)
  r_max_m: 2.0                 # Outer radial edge of the polar grid, in metres (hardcoded extent)
  theta_min_deg: -45.0         # Left angular sweep limit of the polar grid, in degrees (hardcoded extent)
  theta_max_deg: 45.0          # Right angular sweep limit of the polar grid, in degrees (hardcoded extent)
  danger_threshold: 0.3        # Danger score D above which a cell is classified non-traversable
  scrit_deg: 30.0               # Critical slope angle, in degrees — slope values above this clip to infinity (unconditionally non-traversable)
  rcrit_m: 0.10                 # Critical roughness, in metres (3x3 neighbourhood std-dev of height) — above this clips to infinity
  hcrit_m: 0.20                 # Critical step height, in metres — used both in the step-height (τ) qualification test and as the h_crit normalizer in the danger score blend
  polar_grid_size_r_m: 0.10     # Radial bin size of the height-map grid, in metres
  polar_grid_size_theta_deg: 1.0  # Angular bin size of the height-map grid, in degrees.

# comm sends processed frames across network via CommManager.
# disk writes processed csv frames to disk, useful for analysis and debugging.
# Only one consumer can be used at a time. Technically the code supports multiple consumers, but the config parsing only accepts one for now.
consumer: comm

comm_sender:
  remote_ip: "127.0.0.1"


disk_writer:
  output_dir: "../output/theta_1.0"
  write_images: false
