zed:
  # Options: METER, CENTIMETER, MILLIMETER, INCH, FOOT
  coordinate_units: METER
  # pipeline assumes Z is up, X is forward, Y is left
  coordinate_system: RIGHT_HANDED_Z_UP_X_FWD
  # Options: PERFORMANCE, QUALITY, ULTRA, NEURAL
  depth_mode: PERFORMANCE
  # fix this hardcoding
  resolution: HD720
  svo_path: ""    
  # When true, the ZED SDK throttles SVO playback to match the original recording FPS. 
  svo_real_time: false 
  fps: 30
  frame_skip: 1


voxel_filter:
  voxel_size_x: 0.05
  voxel_size_y: 0.05
  voxel_size_z: 0.05
  min_points_per_voxel: 3


polarize:
  z_threshold: 0.45
  min_range: 0.1


traversability:
  r_min_m: 0.3
  r_max_m: 2.0
  theta_min_deg: -45.0
  theta_max_deg: 45.0
  danger_threshold: 0.3
  scrit_deg: 30.0
  rcrit_m: 0.10
  hcrit_m: 0.20
  polar_grid_size_r_m: 0.10
  polar_grid_size_theta_deg: 5.0


disk_writer:
  output_dir: "../output/frames2"
  write_images: false
